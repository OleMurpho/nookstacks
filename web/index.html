<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nookstacks</title>
<meta name="description" content="An infinite board for every project you're building. Notes, documents, images, PDFs, video, audio and 3D models on one canvas — local-first, on Windows, Linux and in the browser.">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark light">
<link rel="canonical" href="https://nookstacks.io/">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Nookstacks">
<meta property="og:url" content="https://nookstacks.io/">
<meta property="og:title" content="Nookstacks — an infinite board for every project">
<meta property="og:description" content="Notes, documents, images, PDFs, video, audio and 3D models on one canvas. Local-first, on Windows, Linux and in the browser.">
<meta property="og:image" content="https://nookstacks.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Nookstacks">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nookstacks — an infinite board for every project">
<meta name="twitter:description" content="Notes, documents, images, PDFs, video, audio and 3D models on one canvas. Local-first.">
<meta name="twitter:image" content="https://nookstacks.io/og.png">

<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="themes.css?v=1">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/jsm/",
    "fzstd": "./vendor/fzstd.mjs"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="cylinder"></div>

  <div id="menubar">
    <div class="mb-mark" aria-hidden="true"></div>
    <nav id="mb-menus"></nav>
    <div class="mb-right"><span id="mb-hint"></span></div>
  </div>

  <header id="topbar">
    <div id="crumb"><span id="levelName">—</span><span class="sep">/</span><span id="projectName">—</span></div>
    <div class="tb-tools">
      <button data-tool="note" title="New note (N)"><i>▤</i>Note</button>
      <button data-tool="text" title="New document (T)"><i>≡</i>Document</button>
      <button data-tool="import" title="Place files from your computer"><i>⬆</i>Import</button>
      <button data-tool="url" title="Place an image, model or link from the web"><i>⌘</i>From URL</button>
      <span class="tb-div"></span>
      <button data-tool="region" title="Draw a region around things (G)"><i>▢</i>Region</button>
      <button data-tool="fit" title="Fit this project (F)"><i>⤢</i>Fit</button>
      <button data-tool="delete" id="btnDelete" disabled title="Delete selection (Del)"><i>✕</i>Delete</button>
    </div>
    <div id="saveState" class="savestate" title="where this board is stored">connecting…</div>
    <div id="counts"></div>
  </header>

  <aside id="rail">
    <div class="railhead">Categories</div>
    <div id="catList"></div>
    <button id="addCat" class="railadd" title="Add category">+</button>
    <div class="railhead second">Projects</div>
    <div id="projList"></div>
    <button id="addProj" class="railadd" title="Add project">+</button>
    <div class="railfoot">
      <button id="openSettings" title="Settings"><span>⚙</span>Settings</button>
    </div>
  </aside>
  <div id="world"></div>
  <button id="navPrev" class="navarrow left" hidden title="Previous project">‹</button>
  <button id="navNext" class="navarrow right" hidden title="Next project">›</button>
  <div id="empty" hidden>
    <p>Nothing on this shelf yet.</p>
    <p class="sub">Import a file, drop one onto the board, or press <b>N</b> to write.</p>
  </div>

  <div id="settings" hidden>
    <div class="scrim" data-close></div>
    <section class="drawer" role="dialog" aria-label="Settings">
      <header><h2>Settings</h2><button class="setx" data-close title="Close (Esc)">✕</button></header>

      <div class="sgroup">
        <div class="slabel">Theme</div>
        <div class="themes" id="themeGrid"></div>
      </div>

      <div class="sgroup" id="customGroup" hidden>
        <div class="slabel">Custom theme</div>
        <div class="crow"><span>Background</span><input type="color" data-ck="bg"></div>
        <div class="crow"><span>Surfaces</span><input type="color" data-ck="surface"></div>
        <div class="crow"><span>Paper</span><input type="color" data-ck="paper"></div>
        <div class="crow"><span>Text</span><input type="color" data-ck="text"></div>
        <div class="crow"><span>Accent</span><input type="color" data-ck="accent"></div>
        <div class="srow"><span>Copy from</span>
          <span class="seedrow"><select id="customBase" class="selbox"></select><button class="linkbtn" id="customSeed">Load</button></span>
        </div>
        <div class="srow"><span>Start over</span><button class="linkbtn" id="customReset">Reset custom</button></div>
      </div>

      <div class="sgroup">
        <div class="srow"><span>Text size</span>
          <div class="seg" data-set="size"><button data-v="compact">S</button><button data-v="regular">M</button><button data-v="large">L</button></div>
        </div>
        <div class="srow"><span>Board grid</span>
          <div class="seg" data-set="grid"><button data-v="off">Off</button><button data-v="on">On</button></div>
        </div>
        <div class="srow"><span>Reduce motion</span>
          <div class="seg" data-set="motion"><button data-v="full">Off</button><button data-v="reduce">On</button></div>
        </div>
      </div>

      <div class="sgroup">
        <div class="srow"><span>Board data</span><button class="linkbtn" id="vaultBtn">Open folder</button></div>
        <div class="srow"><span>Version</span><span class="ver">0.1.0</span></div>
      </div>

      <footer><button class="ghostbtn" id="settingsReset">Reset to defaults</button></footer>
    </section>
  </div>

  <input id="fileinput" type="file" multiple hidden>
</div>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
