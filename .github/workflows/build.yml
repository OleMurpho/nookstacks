name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bundles: deb,rpm,appimage
          - os: windows-latest
            name: windows
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build installers
        run: cargo install tauri-cli --version "^2" --locked --quiet && cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: src-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: nookstacks-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/**
            src-tauri/target/release/bundle/rpm/**
            src-tauri/target/release/bundle/appimage/**
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/bundle/msi/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect installers
        run: |
          mkdir -p out
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          ls -la out

      - name: Build the update manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          files = os.listdir('out')
          def pick(pred):
              for f in sorted(files):
                  if pred(f):
                      return f
          win = pick(lambda f: f.endswith('.exe') and 'setup' in f)
          lin = pick(lambda f: f.endswith('.AppImage'))
          tag = os.environ['GITHUB_REF_NAME']
          version = tag.lstrip('v')
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          def entry(name):
              path = os.path.join('out', name)
              data = open(path, 'rb').read()
              return {"url": base + name,
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size": len(data)}
          manifest = {
              "version": version,
              "notes": f"Nookstacks {version}",
              "assets": {},
          }
          if win:
              manifest["assets"]["windows-x86_64"] = entry(win)
          if lin:
              manifest["assets"]["linux-x86_64"] = entry(lin)
          with open('out/latest.json', 'w') as fh:
              json.dump(manifest, fh, indent=2)
          print(open('out/latest.json').read())
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          body: |
            Installers for Windows and Linux, built from this tag.

            **Windows** — run `Nookstacks_*_x64-setup.exe` (per-user install, no admin needed) or the `.msi`.
            **Linux** — the `.AppImage` runs on any distribution; the `.deb`/`.rpm` are for the matching package manager.

            Data lives in `%APPDATA%\Nookstacks\vault` on Windows and `~/.local/share/Nookstacks/vault` on Linux.
