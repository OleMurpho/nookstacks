[package]
name = "nookstacks"
version = "0.2.1"
description = "A tower of project bookshelves"
authors = ["OleMurpho"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/OleMurpho/nookstacks"

[lib]
name = "nookstacks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
